<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 60" width="100%" height="100%">
  <defs>
    <!-- Heart Gradients -->
    <radialGradient id="heartGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#ff7eb3" />
      <stop offset="50%" stop-color="#ff0f47" />
      <stop offset="100%" stop-color="#cc0022" />
    </radialGradient>
    
    <!-- Wings Gradients -->
    <linearGradient id="wingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#ffe4e6" />
      <stop offset="100%" stop-color="#fda4af" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    
    <!-- Glowing Effect for Heart and Blood -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ff0f47" flood-opacity="0.8"/>
    </filter>

    <!-- Extreme Red Glow for Animated Borders -->
    <filter id="redEnergy" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ff0000" flood-opacity="1"/>
    </filter>

    <!-- Clip Path for the Shine Effect so it stays inside the heart -->
    <clipPath id="heartClip">
      <path d="M 50 45 C 50 45, 30 30, 30 18 C 30 10, 40 5, 50 15 C 60 5, 70 10, 70 18 C 70 30, 50 45, 50 45 Z"/>
    </clipPath>
  </defs>

  <!-- ================= LEFT WING ================= -->
  <g filter="url(#shadow)">
    <!-- Base Wing -->
    <path d="M 45 30 Q 30 15 10 25 Q 20 35 35 35 Q 25 45 15 45 Q 30 50 40 40 Z" fill="url(#wingGradient)" stroke="#ffffff" stroke-width="0.5"/>
    
    <!-- Animated Red Running Border (انرجی لائن) -->
    <path d="M 45 30 Q 30 15 10 25 Q 20 35 35 35 Q 25 45 15 45 Q 30 50 40 40 Z" fill="none" stroke="#ff0f47" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="25 80" filter="url(#redEnergy)">
      <animate attributeName="stroke-dashoffset" from="105" to="0" dur="2.5s" repeatCount="indefinite"/>
    </path>
    
    <!-- Inner Wing Details -->
    <path d="M 40 28 Q 25 18 5 20 Q 15 30 30 30" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- ================= RIGHT WING ================= -->
  <g filter="url(#shadow)">
    <!-- Base Wing -->
    <path d="M 55 30 Q 70 15 90 25 Q 80 35 65 35 Q 75 45 85 45 Q 70 50 60 40 Z" fill="url(#wingGradient)" stroke="#ffffff" stroke-width="0.5"/>
    
    <!-- Animated Red Running Border (انرجی لائن) -->
    <path d="M 55 30 Q 70 15 90 25 Q 80 35 65 35 Q 75 45 85 45 Q 70 50 60 40 Z" fill="none" stroke="#ff0f47" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="25 80" filter="url(#redEnergy)">
      <animate attributeName="stroke-dashoffset" from="0" to="105" dur="2.5s" repeatCount="indefinite"/>
    </path>

    <!-- Inner Wing Details -->
    <path d="M 60 28 Q 75 18 95 20 Q 85 30 70 30" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  </g>

  <!-- ================= MAIN HEART ================= -->
  <path d="M 50 45 C 50 45, 30 30, 30 18 C 30 10, 40 5, 50 15 C 60 5, 70 10, 70 18 C 70 30, 50 45, 50 45 Z" fill="url(#heartGlow)" filter="url(#glow)" stroke="#ffffff" stroke-width="1.5"/>

  <!-- ================= SHINE EFFECT (چمک) ================= -->
  <g clip-path="url(#heartClip)">
    <!-- موٹی چمک -->
    <rect y="-10" width="14" height="80" fill="rgba(255,255,255,0.6)" transform="skewX(-30)">
      <animate attributeName="x" values="-30; 120; 120" keyTimes="0; 0.6; 1" dur="3s" repeatCount="indefinite"/>
    </rect>
    <!-- پتلی چمک -->
    <rect y="-10" width="4" height="80" fill="rgba(255,255,255,0.9)" transform="skewX(-30)">
      <animate attributeName="x" values="-45; 105; 105" keyTimes="0; 0.6; 1" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- ================= HEARTBEAT (Blood Flow) ================= -->
  
  <!-- Base Track (ہلکی وائٹ لائن جو پیچھے نظر آئے گی) -->
  <polyline points="35,25 42,25 46,15 50,35 54,20 58,25 65,25" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)"/>
  
  <!-- Animated Blood Flow (خون چلنے کی انیمیشن) -->
  <polyline points="35,25 42,25 46,15 50,35 54,20 58,25 65,25" fill="none" stroke="#ff0033" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="18 80" filter="url(#redEnergy)">
    <animate attributeName="stroke-dashoffset" values="90; -20" dur="1.5s" repeatCount="indefinite"/>
  </polyline>

</svg>