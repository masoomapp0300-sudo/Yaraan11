<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- گہرا براؤن/گولڈ بیک گراؤنڈ -->
    <radialGradient id="btnBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6B4A15" />
      <stop offset="60%" stop-color="#362205" />
      <stop offset="100%" stop-color="#140B00" />
    </radialGradient>

    <!-- میٹالک گولڈ چمکدار بارڈر -->
    <linearGradient id="metallicBorder" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB1" />
      <stop offset="25%" stop-color="#B68936" />
      <stop offset="50%" stop-color="#4A2F08" />
      <stop offset="75%" stop-color="#C59942" />
      <stop offset="100%" stop-color="#FFF4D0" />
    </linearGradient>

    <!-- تیر کے نشانات کے لیے وائٹ اور ہلکا گولڈ گریڈینٹ -->
    <linearGradient id="arrowColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FDF3DA" />
    </linearGradient>
  </defs>

  <!-- مین گول دائرہ -->
  <circle cx="50" cy="50" r="45" fill="url(#btnBg)" stroke="url(#metallicBorder)" stroke-width="4.5" />

  <!-- درست زاویے پر گھمائے گئے بھرے ہوئے تیر (اب یہ بالکل تصویر جیسے ہیں) -->
  <g transform="rotate(45 50 50)" fill="url(#arrowColor)">
    <!-- ٹاپ رائٹ سے اندر کی طرف آنے والا تیر -->
    <path d="M 50 44 L 38 30 L 45 30 L 45 18 L 55 18 L 55 30 L 62 30 Z" />
    
    <!-- باٹم لیفٹ سے اندر کی طرف جانے والا تیر -->
    <path d="M 50 56 L 38 70 L 45 70 L 45 82 L 55 82 L 55 70 L 62 70 Z" />
  </g>
</svg>