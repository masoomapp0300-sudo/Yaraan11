<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGradEmoji" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BF953F" /><stop offset="25%" style="stop-color:#FCF6BA" />
      <stop offset="50%" style="stop-color:#B38728" /><stop offset="75%" style="stop-color:#FBF5B7" />
      <stop offset="100%" style="stop-color:#AA771C" />
    </linearGradient>
    <pattern id="texEmoji" patternUnits="userSpaceOnUse" width="2" height="2" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="2" style="stroke:#8A6D3B; stroke-width:0.6" />
    </pattern>
  </defs>
  <!-- Main Face -->
  <circle cx="50" cy="50" r="42" fill="url(#goldGradEmoji)" stroke="#8A6D3B" stroke-width="1"/>
  <!-- Eyes and Smile -->
  <g fill="#333" opacity="0.4">
    <circle cx="35" cy="42" r="5" />
    <circle cx="65" cy="42" r="5" />
    <path d="M 30,62 Q 50,78 70,62" fill="none" stroke="#333" stroke-width="6" stroke-linecap="round" />
  </g>
  <!-- Texture Overlay -->
  <circle cx="50" cy="50" r="42" fill="url(#texEmoji)" style="opacity: 0.5;" />
</svg>