<svg width="500" height="500" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- ڈیفینیشنز برائے گولڈن کلر اور لائن پیٹرن -->
  <defs>
    <!-- گولڈن گریڈیئنٹ -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BF953F;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#FCF6BA;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#B38728;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#FBF5B7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#AA771C;stop-opacity:1" />
    </linearGradient>

    <!-- اندرونی لائنوں کا پیٹرن -->
    <pattern id="innerLines" patternUnits="userSpaceOnUse" width="2" height="2" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="2" style="stroke:#8A6D3B; stroke-width:0.5" />
    </pattern>
    
    <!-- ڈیزائن کا ماسک -->
    <mask id="powerMask">
       <path d="M 50,35 L 50,15 M 30,25 A 30,30 0 1 0 70,25" 
             fill="none" 
             stroke="white" 
             stroke-width="8" 
             stroke-linecap="round"/>
    </mask>
  </defs>

  <!-- مین پاور آئیکن (گولڈن بیس) -->
  <path d="M 50,35 L 50,15 M 30,25 A 30,30 0 1 0 70,25" 
        fill="none" 
        stroke="url(#goldGradient)" 
        stroke-width="8" 
        stroke-linecap="round"/>

  <!-- ڈیزائن کے اندر باریک لائنیں -->
  <path d="M 50,35 L 50,15 M 30,25 A 30,30 0 1 0 70,25" 
        fill="none" 
        stroke="url(#innerLines)" 
        stroke-width="6" 
        stroke-linecap="round"
        style="opacity: 0.6;"/>
</svg>