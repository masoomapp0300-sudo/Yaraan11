<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="trophyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff9c4" />
      <stop offset="30%" stop-color="#fbc02d" />
      <stop offset="70%" stop-color="#f57f17" />
      <stop offset="100%" stop-color="#fff59d" />
    </linearGradient>
    <filter id="trophyShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <g filter="url(#trophyShadow)">
    <!-- ٹرافی کا کپ -->
    <path d="M 35,20 L 65,20 C 65,45 58,55 50,55 C 42,55 35,45 35,20 Z" fill="url(#trophyGold)" stroke="#fff" stroke-width="1.5" />
    
    <!-- ہینڈلز -->
    <path d="M 35,25 Q 23,28 35,42" fill="none" stroke="url(#trophyGold)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 65,25 Q 77,28 65,42" fill="none" stroke="url(#trophyGold)" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- اسٹینڈ/سٹیم -->
    <path d="M 46,55 L 54,55 L 53,70 L 47,70 Z" fill="url(#trophyGold)" />
    
    <!-- نچلا بیس (Base) -->
    <rect x="38" y="70" width="24" height="12" rx="4" fill="#3e2723" stroke="url(#trophyGold)" stroke-width="1.5" />
    <rect x="42" y="72" width="16" height="4" rx="1" fill="url(#goldTrophy)" />
    
    <!-- اوپر چمکتے ہوئے تارے -->
    <path d="M 28,15 L 30,18 L 35,19 L 30,21 L 28,25 L 26,21 L 21,19 L 26,18 Z" fill="#fff" opacity="0.9" />
    <path d="M 72,12 L 73,15 L 77,16 L 73,17 L 72,21 L 71,17 L 67,16 L 71,15 Z" fill="#fff" opacity="0.9" />
  </g>
</svg>