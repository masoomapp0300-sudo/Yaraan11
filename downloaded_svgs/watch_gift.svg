<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Glow Filter for Fireworks -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Dial Clip Path for Shine Effect -->
    <clipPath id="dialClip">
      <circle cx="200" cy="250" r="110"/>
    </clipPath>

    <!-- Gold Gradient for Case -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d484"/>
      <stop offset="50%" stop-color="#b68936"/>
      <stop offset="100%" stop-color="#f3d484"/>
    </linearGradient>

    <!-- Blue Gradient for Dial -->
    <radialGradient id="blueDial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a4b85"/>
      <stop offset="100%" stop-color="#122547"/>
    </radialGradient>
  </defs>

  <style>
    /* --- NEW: Firework Animations --- */
    .firework {
      opacity: 0;
      animation: burst 3.5s infinite ease-out;
    }
    .fw-delay-1 { animation-delay: 0.5s; transform-origin: 80px 150px; }
    .fw-delay-2 { animation-delay: 1.8s; transform-origin: 320px 180px; }
    .fw-delay-3 { animation-delay: 2.5s; transform-origin: 200px 380px; }
    .fw-delay-4 { animation-delay: 1s; transform-origin: 280px 80px; }

    @keyframes burst {
      0% { transform: scale(0.1); opacity: 1; }
      60% { opacity: 0.8; }
      100% { transform: scale(2.5); opacity: 0; }
    }

    /* --- NEW: Twinkling Glowing Stars/Sparks --- */
    .sparkle {
      animation: twinkle 2s infinite alternate ease-in-out;
    }
    .sp-1 { animation-delay: 0s; }
    .sp-2 { animation-delay: 0.5s; }
    .sp-3 { animation-delay: 1s; }
    .sp-4 { animation-delay: 1.5s; }

    @keyframes twinkle {
      0% { opacity: 0.1; transform: scale(0.5); }
      100% { opacity: 1; transform: scale(1.5); box-shadow: 0 0 10px white; }
    }

    /* --- Existing Watch Animations --- */
    .watch-container {
      transform-origin: 200px 250px;
      animation: introAnim 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      opacity: 0;
      transform: scale(0) rotate(-45deg);
    }

    @keyframes introAnim {
      0% { transform: scale(0) rotate(-45deg); opacity: 0; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .shine-effect {
      fill: rgba(255, 255, 255, 0.4);
      transform-origin: 200px 250px;
      animation: shineMove 3s infinite ease-in-out;
    }

    @keyframes shineMove {
      0% { transform: translateX(-200px) skewX(-45deg); }
      20% { transform: translateX(300px) skewX(-45deg); }
      100% { transform: translateX(300px) skewX(-45deg); }
    }

    .second-hand {
      transform-origin: 200px 250px;
      animation: tickTock 60s steps(60, end) infinite;
    }

    @keyframes tickTock {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- ========================================== -->
  <!-- BACKGROUND ANIMATIONS (FIREWORKS & SPARKS) -->
  <!-- ========================================== -->
  
  <!-- Glowing Background Sparks -->
  <g fill="#f3d484" filter="url(#glow)">
    <circle cx="60" cy="200" r="3" class="sparkle sp-1"/>
    <circle cx="350" cy="250" r="4" class="sparkle sp-2" fill="#84b5f3"/>
    <circle cx="120" cy="400" r="2.5" class="sparkle sp-3"/>
    <circle cx="280" cy="420" r="3" class="sparkle sp-4" fill="#84b5f3"/>
    <circle cx="150" cy="80" r="3.5" class="sparkle sp-1"/>
  </g>

  <!-- Firework 1 (Top Left) -->
  <g class="firework fw-delay-1" filter="url(#glow)">
    <circle cx="80" cy="150" r="20" fill="none" stroke="#f3d484" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
    <circle cx="80" cy="150" r="35" fill="none" stroke="#84b5f3" stroke-width="2" stroke-dasharray="4 15" stroke-linecap="round"/>
    <circle cx="80" cy="150" r="3" fill="#ffffff"/>
  </g>

  <!-- Firework 2 (Top Right) -->
  <g class="firework fw-delay-2" filter="url(#glow)">
    <circle cx="320" cy="180" r="25" fill="none" stroke="#f3d484" stroke-width="4" stroke-dasharray="3 15" stroke-linecap="round"/>
    <circle cx="320" cy="180" r="45" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="5 20" stroke-linecap="round"/>
    <circle cx="320" cy="180" r="4" fill="#f3d484"/>
  </g>

  <!-- Firework 3 (Bottom Center) -->
  <g class="firework fw-delay-3" filter="url(#glow)">
    <circle cx="200" cy="380" r="30" fill="none" stroke="#84b5f3" stroke-width="3" stroke-dasharray="4 18" stroke-linecap="round"/>
    <circle cx="200" cy="380" r="50" fill="none" stroke="#f3d484" stroke-width="2" stroke-dasharray="2 25" stroke-linecap="round"/>
    <circle cx="200" cy="380" r="3" fill="#ffffff"/>
  </g>

  <!-- Firework 4 (Top Right Small) -->
  <g class="firework fw-delay-4" filter="url(#glow)">
    <circle cx="280" cy="80" r="15" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>
    <circle cx="280" cy="80" r="2" fill="#84b5f3"/>
  </g>


  <!-- ========================================== -->
  <!-- MAIN WATCH CONTAINER                       -->
  <!-- ========================================== -->
  <g class="watch-container">
    
    <!-- Top Strap -->
    <path d="M 150 135 L 155 40 Q 200 30 245 40 L 250 135 Z" fill="#182c52" stroke="#101c36" stroke-width="2"/>
    <path d="M 160 45 L 160 130 M 240 45 L 240 130" stroke="#0e1b33" stroke-width="2" stroke-dasharray="3,3"/>

    <!-- Bottom Strap -->
    <path d="M 150 365 L 155 460 Q 200 470 245 460 L 250 365 Z" fill="#182c52" stroke="#101c36" stroke-width="2"/>
    <path d="M 160 455 L 160 370 M 240 455 L 240 370" stroke="#0e1b33" stroke-width="2" stroke-dasharray="3,3"/>
    
    <!-- Maurice Lacroix Logo on Bottom Strap -->
    <path d="M 185 430 Q 185 410 200 410 Q 215 410 215 430" fill="none" stroke="#d4af37" stroke-width="4" stroke-linecap="round"/>
    <line x1="200" y1="410" x2="200" y2="430" stroke="#d4af37" stroke-width="4" stroke-linecap="round"/>

    <!-- Lugs -->
    <path d="M 135 150 L 150 130 L 160 130 L 150 150 Z" fill="url(#goldGrad)"/>
    <path d="M 265 150 L 250 130 L 240 130 L 250 150 Z" fill="url(#goldGrad)"/>
    <path d="M 135 350 L 150 370 L 160 370 L 150 350 Z" fill="url(#goldGrad)"/>
    <path d="M 265 350 L 250 370 L 240 370 L 250 350 Z" fill="url(#goldGrad)"/>

    <!-- Crown & Buttons -->
    <rect x="315" y="160" width="12" height="15" rx="3" fill="url(#goldGrad)" transform="rotate(30, 315, 160)"/>
    <rect x="320" y="235" width="16" height="30" rx="4" fill="url(#goldGrad)"/>
    <rect x="295" y="325" width="12" height="15" rx="3" fill="url(#goldGrad)" transform="rotate(-30, 295, 325)"/>

    <!-- Main Outer Case (Gold) -->
    <circle cx="200" cy="250" r="120" fill="url(#goldGrad)" filter="drop-shadow(3px 5px 10px rgba(0,0,0,0.5))"/>
    
    <!-- Inner Gold Rim -->
    <circle cx="200" cy="250" r="114" fill="none" stroke="#e0b85c" stroke-width="2"/>

    <!-- Blue Dial -->
    <circle cx="200" cy="250" r="110" fill="url(#blueDial)"/>

    <!-- Dial Details (Tick Marks) -->
    <g stroke="#e0b85c" stroke-width="2" stroke-linecap="round">
      <line x1="200" y1="145" x2="200" y2="160" stroke-width="4"/> <!-- 12 -->
      <line x1="200" y1="340" x2="200" y2="355" stroke-width="4"/> <!-- 6 -->
      <line x1="145" y1="250" x2="160" y2="250" stroke-width="4"/> <!-- 9 -->
      <line x1="295" y1="250" x2="280" y2="250" stroke-width="4"/> <!-- 3 -->
      <line x1="250" y1="160" x2="242" y2="175"/>
      <line x1="285" y1="200" x2="270" y2="210"/>
      <line x1="285" y1="300" x2="270" y2="290"/>
      <line x1="250" y1="340" x2="242" y2="325"/>
      <line x1="150" y1="340" x2="158" y2="325"/>
      <line x1="115" y1="300" x2="130" y2="290"/>
      <line x1="115" y1="200" x2="130" y2="210"/>
      <line x1="150" y1="160" x2="158" y2="175"/>
    </g>

    <!-- Sub-dials -->
    <circle cx="160" cy="250" r="22" fill="none" stroke="#6884b5" stroke-width="1"/>
    <circle cx="240" cy="250" r="22" fill="none" stroke="#6884b5" stroke-width="1"/>
    <circle cx="200" cy="295" r="20" fill="none" stroke="#6884b5" stroke-width="1"/>

    <!-- Date Window -->
    <rect x="235" y="280" width="20" height="20" rx="2" fill="white" transform="rotate(30, 235, 280)"/>
    <text x="240" y="295" fill="black" font-family="Arial" font-size="10" font-weight="bold" transform="rotate(30, 235, 280)">8</text>

    <!-- Logo on Dial -->
    <path d="M 195 170 Q 195 160 200 160 Q 205 160 205 170" fill="none" stroke="#d4af37" stroke-width="2"/>
    <line x1="200" y1="160" x2="200" y2="170" stroke="#d4af37" stroke-width="2"/>
    <text x="200" y="185" fill="white" font-family="Arial" font-size="8" text-anchor="middle" letter-spacing="1">MAURICE LACROIX</text>

    <!-- Hands -->
    <polygon points="197,250 200,180 203,250" fill="url(#goldGrad)" transform="rotate(45, 200, 250)"/>
    <polygon points="198,250 200,150 202,250" fill="url(#goldGrad)" transform="rotate(110, 200, 250)"/>
    
    <!-- Second Hand (Animated) -->
    <g class="second-hand">
      <line x1="200" y1="265" x2="200" y2="145" stroke="#d4af37" stroke-width="2"/>
      <circle cx="200" cy="250" r="4" fill="#d4af37"/>
    </g>

    <!-- Glass Shine Effect -->
    <g clip-path="url(#dialClip)">
      <polygon class="shine-effect" points="150,0 200,0 100,500 50,500"/>
    </g>
    
    <!-- Outer Glass reflection -->
    <path d="M 105 200 A 95 95 0 0 1 295 200 A 100 100 0 0 0 105 200" fill="rgba(255,255,255,0.05)"/>

  </g>
</svg>