<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 650" width="100%" height="100%">
  <defs>
    <!-- گہرا تھری ڈی شیڈو اثر -->
    <filter id="ultra3DShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000000" flood-opacity="0.85" />
    </filter>
    <filter id="sparkleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- کروم گولڈ گریڈینٹ -->
    <linearGradient id="goldChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="15%" stop-color="#ffe680" />
      <stop offset="40%" stop-color="#cc9300" />
      <stop offset="55%" stop-color="#735000" />
      <stop offset="75%" stop-color="#ffcc00" />
      <stop offset="90%" stop-color="#996f00" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#805c00" />
      <stop offset="100%" stop-color="#332500" />
    </linearGradient>
    <!-- مخمل پردے کے فولڈز -->
    <linearGradient id="curtainFolds" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.55" />
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="30%" stop-color="#000000" stop-opacity="0.65" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#000000" stop-opacity="0.65" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.55" />
    </linearGradient>
    <!-- گہرا لال مخمل گریڈینٹ -->
    <radialGradient id="velvetBase" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ff1a3d" />
      <stop offset="60%" stop-color="#800010" />
      <stop offset="100%" stop-color="#2d0004" />
    </radialGradient>
    <linearGradient id="premiumBanner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cc001b" />
      <stop offset="50%" stop-color="#73000f" />
      <stop offset="100%" stop-color="#330006" />
    </linearGradient>
    <linearGradient id="glassShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <pattern id="velvetTexture" width="10" height="600" patternUnits="userSpaceOnUse">
      <rect width="5" height="600" fill="#000000" fill-opacity="0.06" />
    </pattern>
  </defs>

  <g id="PremiumCard">
    <path d="M 0,120 C 60,70 140,70 200,120 C 260,70 340,70 400,120 L 400,650 L 0,650 Z" fill="url(#velvetBase)" />
    <path d="M 0,120 C 60,70 140,70 200,120 C 260,70 340,70 400,120 L 400,650 L 0,650 Z" fill="url(#curtainFolds)" style="mix-blend-mode: multiply;" />
    <path d="M 0,120 C 60,70 140,70 200,120 C 260,70 340,70 400,120 L 400,650 L 0,650 Z" fill="url(#velvetTexture)" />
    <path d="M 0,120 C 60,70 140,70 200,120 C 260,70 340,70 400,120" fill="none" stroke="url(#goldChrome)" stroke-width="4.5" filter="url(#ultra3DShadow)" />
    
    <g stroke="url(#goldChrome)" stroke-width="1.5" fill="none" opacity="0.8">
      <line x1="30" y1="108" x2="30" y2="160" />
      <circle cx="30" cy="163" r="3.5" fill="url(#goldChrome)" />
      <line x1="370" y1="108" x2="370" y2="160" />
      <circle cx="370" cy="163" r="3.5" fill="url(#goldChrome)" />
    </g>

    <g id="LuxuryTiara" filter="url(#ultra3DShadow)">
      <path d="M 165,75 C 130,55 90,70 115,85 C 135,80 150,78 165,75 Z" fill="url(#goldChrome)" />
      <path d="M 160,82 C 125,67 95,80 120,92 C 138,87 150,84 160,82 Z" fill="url(#goldChrome)" opacity="0.85" />
      <path d="M 235,75 C 270,55 310,70 285,85 C 265,80 250,78 235,75 Z" fill="url(#goldChrome)" />
      <path d="M 240,82 C 275,67 305,80 280,92 C 262,87 250,84 240,82 Z" fill="url(#goldChrome)" opacity="0.85" />
      <path d="M 168,72 Q 200,79 232,72 L 232,78 Q 200,85 168,78 Z" fill="url(#goldChrome)" />
      <path d="M 200,40 C 196,60 195,68 200,75 C 205,68 204,60 200,40 Z" fill="url(#goldChrome)" />
      <path d="M 186,50 C 185,63 189,69 194,75 C 191,69 188,63 186,50 Z" fill="url(#goldChrome)" />
      <path d="M 214,50 C 215,63 211,69 206,75 C 209,69 212,63 214,50 Z" fill="url(#goldChrome)" />
      <circle cx="200" cy="37" r="3.5" fill="#ffffff" filter="url(#sparkleGlow)" />
      <circle cx="186" cy="47" r="2.5" fill="#ffffff" filter="url(#sparkleGlow)" />
      <circle cx="214" cy="47" r="2.5" fill="#ffffff" filter="url(#sparkleGlow)" />
    </g>

    <g id="ContributionBanner" filter="url(#ultra3DShadow)">
      <path d="M 75,95 C 130,60 270,60 325,95 L 315,134 C 250,114 150,114 85,134 Z" fill="url(#goldBevel)" />
      <path d="M 75,90 C 130,55 270,55 325,90 L 315,127 C 250,107 150,107 85,127 Z" fill="url(#premiumBanner)" stroke="url(#goldChrome)" stroke-width="3" />
      <path d="M 75,90 C 130,55 270,55 325,90 C 300,100 100,100 75,90 Z" fill="url(#glassShine)" />
      <path d="M 75,90 L 85,127 L 75,110 Z" fill="url(#goldChrome)" />
      <path d="M 325,90 L 315,127 L 325,110 Z" fill="url(#goldChrome)" />
      <text x="201" y="108" fill="#140002" font-size="20" font-weight="900" text-anchor="middle" font-family="'Times New Roman', Times, serif" letter-spacing="1">CONTRIBUTION LIST</text>
      <text x="200" y="106" fill="url(#goldChrome)" font-size="20" font-weight="900" text-anchor="middle" font-family="'Times New Roman', Times, serif" letter-spacing="1" filter="url(#sparkleGlow)">CONTRIBUTION LIST</text>
    </g>
  </g>
</svg>