<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -50 1200 1100" width="100%" height="100%">
    
    <!-- CSS ANIMATIONS -->
    <style>
        @keyframes flap {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-5deg); } 
        }
        
        .animated-wing {
            transform-origin: 280px 550px; 
            animation: flap 3s ease-in-out infinite; 
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.1); filter: drop-shadow(0 0 10px #ffffff); }
        }

        .star-fast { transform-origin: center; animation: twinkle 1.5s ease-in-out infinite; }
        .star-slow { transform-origin: center; animation: twinkle 2.5s ease-in-out infinite 1s; }
        .star-med { transform-origin: center; animation: twinkle 2s ease-in-out infinite 0.5s; }
    </style>

    <defs>
        <filter id="drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="15" stdDeviation="12" flood-color="#000000" flood-opacity="0.75"/>
        </filter>
        
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <linearGradient id="gold-main" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fff5a3" />
            <stop offset="20%" stop-color="#ffd54f" />
            <stop offset="50%" stop-color="#f57f17" />
            <stop offset="80%" stop-color="#b85500" />
            <stop offset="100%" stop-color="#ffb300" />
        </linearGradient>

        <linearGradient id="gold-light" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffeb3b" />
            <stop offset="50%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#ffc107" />
        </linearGradient>

        <radialGradient id="ruby-red" cx="40%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ff4d4d" />
            <stop offset="40%" stop-color="#cc0000" />
            <stop offset="100%" stop-color="#4d0000" />
        </radialGradient>

        <linearGradient id="banner-red" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ff1a1a" />
            <stop offset="50%" stop-color="#b30000" />
            <stop offset="100%" stop-color="#660000" />
        </linearGradient>

        <linearGradient id="white-wing" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="60%" stop-color="#e0e0e0" />
            <stop offset="100%" stop-color="#9e9e9e" />
        </linearGradient>

        <!-- WING COMPONENT -->
        <g id="royal-wing" class="animated-wing">
            <path d="M 280 480 C 100 350 -20 150 40 50 C 130 180 200 280 320 330 Z" fill="url(#gold-main)" filter="url(#drop-shadow)"/>
            <path d="M 260 550 C 50 450 -30 250 10 150 C 100 280 180 380 310 420 Z" fill="url(#gold-main)" filter="url(#drop-shadow)"/>
            <path d="M 250 630 C 20 550 -40 380 0 280 C 80 400 160 500 300 520 Z" fill="url(#gold-main)" filter="url(#drop-shadow)"/>
            
            <path d="M 280 480 C 150 380 40 220 80 120 C 150 250 220 330 310 360 Z" fill="url(#white-wing)" filter="url(#drop-shadow)"/>
            <path d="M 270 540 C 120 460 20 320 50 220 C 130 350 200 420 300 450 Z" fill="url(#white-wing)" filter="url(#drop-shadow)"/>
            <path d="M 260 610 C 90 550 0 420 20 330 C 100 450 180 510 290 530 Z" fill="url(#white-wing)" filter="url(#drop-shadow)"/>

            <path d="M 220 680 C 100 700 80 600 120 550 C 180 620 240 650 300 650 Z" fill="url(#gold-main)" />
        </g>

        <!-- STAR SPARKLE BASE -->
        <g id="star">
            <path d="M 0 -25 Q 3 -5 25 0 Q 3 5 0 25 Q -3 5 -25 0 Q -3 -5 0 -25 Z" fill="#ffffff"/>
        </g>
    </defs>

    <!-- 1. LEFT & RIGHT ROYAL WINGS -->
    <use href="#royal-wing" x="0" y="0" />
    <use href="#royal-wing" x="0" y="0" transform="translate(1000, 0) scale(-1, 1)" />

    <!-- 2. MAIN AVATAR RINGS -->
    <g filter="url(#drop-shadow)">
        <circle cx="500" cy="500" r="235" fill="none" stroke="url(#gold-main)" stroke-width="25" />
        <circle cx="500" cy="500" r="215" fill="none" stroke="url(#banner-red)" stroke-width="12" />
        <circle cx="500" cy="500" r="205" fill="none" stroke="url(#gold-light)" stroke-width="6" />
        <circle cx="500" cy="500" r="255" fill="none" stroke="url(#gold-light)" stroke-width="4" opacity="0.8" />
    </g>

    <!-- 3. SIDE RUBY GEMS -->
    <g transform="translate(240, 500)" filter="url(#drop-shadow)">
        <circle cx="0" cy="0" r="30" fill="url(#gold-main)" />
        <circle cx="0" cy="0" r="20" fill="url(#ruby-red)" filter="url(#glow)"/>
        <polygon points="-5,-10 5,-10 10,-5 10,5 5,10 -5,10 -10,5 -10,-5" fill="#ffffff" opacity="0.4" />
    </g>
    <g transform="translate(760, 500)" filter="url(#drop-shadow)">
        <circle cx="0" cy="0" r="30" fill="url(#gold-main)" />
        <circle cx="0" cy="0" r="20" fill="url(#ruby-red)" filter="url(#glow)"/>
        <polygon points="-5,-10 5,-10 10,-5 10,5 5,10 -5,10 -10,5 -10,-5" fill="#ffffff" opacity="0.4" />
    </g>

    <!-- 4. TOP ROYAL CROWN -->
    <g transform="translate(500, 240)" filter="url(#drop-shadow)">
        <path d="M -80 30 L 80 30 L 60 10 L -60 10 Z" fill="#b85500" />
        <path d="M -100 20 L -140 -60 L -60 -20 L 0 -110 L 60 -20 L 140 -60 L 100 20 Z" fill="url(#gold-main)" stroke="url(#gold-light)" stroke-width="3"/>
        <path d="M -110 20 Q 0 50 110 20 L 100 50 Q 0 80 -100 50 Z" fill="url(#gold-main)" />
        <path d="M -100 35 Q 0 60 100 35" fill="none" stroke="#fff" stroke-width="2" opacity="0.5"/>
        <path d="M 0 -60 L 25 -20 L 0 30 L -25 -20 Z" fill="url(#ruby-red)" stroke="url(#gold-light)" stroke-width="3" filter="url(#glow)"/>
        <polygon points="0,-45 10,-20 0,-10" fill="#ffffff" opacity="0.5"/>
    </g>

    <!-- 5. BOTTOM "NO. 1" BANNER -->
    <g transform="translate(500, 780)" filter="url(#drop-shadow)">
        <path d="M -180 -20 Q 0 20 180 -20 L 140 60 Q 0 130 -140 60 Z" fill="url(#banner-red)" stroke="url(#gold-main)" stroke-width="12" />
        <path d="M -160 -10 Q 0 25 160 -10 L 125 50 Q 0 110 -125 50 Z" fill="none" stroke="url(#gold-light)" stroke-width="3" opacity="0.6"/>
        
        <text x="0" y="65" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="45" fill="url(#gold-light)" text-anchor="middle" filter="url(#drop-shadow)">
            NO. 1
        </text>
        <text x="0" y="65" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="45" fill="#ffffff" text-anchor="middle" opacity="0.9">
            NO. 1
        </text>

        <path d="M -180 -20 Q -240 -30 -260 20 Q -200 10 -140 60" fill="url(#gold-main)" />
        <path d="M 180 -20 Q 240 -30 260 20 Q 200 10 140 60" fill="url(#gold-main)" />
    </g>

    <!-- 6. FLOATING ANIMATED SPARKLES -->
    <g class="star-fast"><use href="#star" x="250" y="280" transform="scale(0.8)" /></g>
    <g class="star-slow"><use href="#star" x="750" y="280" transform="scale(0.9)" /></g>
    <g class="star-med"><use href="#star" x="180" y="580" transform="scale(0.6)" /></g>
    <g class="star-fast"><use href="#star" x="820" y="580" transform="scale(0.7)" /></g>
    <g class="star-slow"><use href="#star" x="350" y="150" transform="scale(0.5)" /></g>
    <g class="star-med"><use href="#star" x="650" y="150" transform="scale(0.5)" /></g>
    <g class="star-fast"><use href="#star" x="300" y="800" transform="scale(0.6)" /></g>
    <g class="star-slow"><use href="#star" x="700" y="800" transform="scale(0.6)" /></g>

</svg>