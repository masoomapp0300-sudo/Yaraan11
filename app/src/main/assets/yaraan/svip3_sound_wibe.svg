<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* مین بلیو تھیم */
    .base-ring {
      fill: none;
      stroke: #00d2ff;
      stroke-width: 7;
      filter: drop-shadow(0 0 8px #00d2ff);
    }

    /* گھومتا ہوا نیون ہالہ (Orbit Animation) */
    .orbit-glow {
      fill: none;
      stroke: #0077ff;
      stroke-width: 30;
      stroke-dasharray: 150 450;
      filter: blur(15px);
      opacity: 0.6;
      transform-origin: center;
      animation: rotateOrbit 4s linear infinite;
    }

    /* سافٹ پلسنگ گلو (Breathing Effect) */
    .breathing-aura {
      fill: none;
      stroke: #00ffff;
      stroke-width: 40;
      filter: blur(25px);
      transform-origin: center;
      animation: pulseBlue 2.5s infinite ease-in-out;
    }

    /* الیکٹرک شعاعیں (Electric Rays) */
    .ray {
      stroke: #00d2ff;
      stroke-width: 2;
      stroke-linecap: round;
      opacity: 0.3;
    }

    /* اینیمیشن کی تفصیل */
    @keyframes rotateOrbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulseBlue {
      0%, 100% { opacity: 0.2; transform: scale(0.95); }
      50% { opacity: 0.5; transform: scale(1.05); }
    }

    .sparkle {
      animation: flicker 3s infinite ease-in-out;
    }

    @keyframes flicker {
      0%, 100% { opacity: 0.1; }
      50% { opacity: 1; }
    }
  </style>

  <defs>
    <!-- ماسک تاکہ یوزر کی تصویر والا حصہ بالکل کلین رہے -->
    <mask id="dp-mask-svip3">
      <rect width="100%" height="100%" fill="white" />
      <circle cx="200" cy="200" r="102" fill="black" />
    </mask>
  </defs>

  <!-- اینیمیٹڈ گلو اور لہریں (صرف باہر) -->
  <g mask="url(#dp-mask-svip3)">
    <circle class="breathing-aura" cx="200" cy="200" r="120" />
    <circle class="orbit-glow" cx="200" cy="200" r="120" />
    
    <!-- 12 الیکٹرک شعاعیں -->
    <g transform-origin="200 200">
      <line class="ray" x1="200" y1="50" x2="200" y2="90" transform="rotate(0 200 200)" />
      <line class="ray" x1="200" y1="50" x2="200" y2="90" transform="rotate(30 200 200)" />
      <line class="ray" x1="200" y1="50" x2="200" y2="90" transform="rotate(60 200 200)" />
      <line class="ray" x1="200" y1="50" x2="200" y2="90" transform="rotate(90 200 200)" />
      <line class="ray" x1="200" y1="50" x2="200" y2="90" transform="rotate(120 200 200)" />
      <line class="ray" x1="200" y1="50" x2="200" y2="90" transform="rotate(150 200 200)" />
      <line class="ray" x1="200" y1="50" x2="200" y2="90" transform="rotate(180 200 200)" />
      <line class="ray" x1="200" y1="50" x2="200" y2="90" transform="rotate(210 200 200)" />
      <line class="ray" x1="200" y1="50" x2="200" y2="90" transform="rotate(240 200 200)" />
      <line class="ray" x1="200" y1="50" x2="200" y2="90" transform="rotate(270 200 200)" />
      <line class="ray" x1="200" y1="50" x2="200" y2="90" transform="rotate(300 200 200)" />
      <line class="ray" x1="200" y1="50" x2="200" y2="90" transform="rotate(330 200 200)" />
    </g>
  </g>

  <!-- مین بلیو بارڈر -->
  <circle class="base-ring" cx="200" cy="200" r="105" />

  <!-- بلیو چمکدار ذرات (Sparkles) -->
  <circle class="sparkle" cx="280" cy="80" r="1.5" fill="#00ffff" />
  <circle class="sparkle" cx="120" cy="320" r="2" fill="white" style="animation-delay: 1s;" />
  <circle class="sparkle" cx="340" cy="180" r="1" fill="#00ffff" style="animation-delay: 1.5s;" />
  <circle class="sparkle" cx="60" cy="150" r="1.2" fill="white" style="animation-delay: 2s;" />
</svg>