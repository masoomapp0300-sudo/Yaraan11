<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldSpeakerGradMute" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BF953F" />
      <stop offset="25%" style="stop-color:#FCF6BA" />
      <stop offset="50%" style="stop-color:#B38728" />
      <stop offset="75%" style="stop-color:#FBF5B7" />
      <stop offset="100%" style="stop-color:#AA771C" />
    </linearGradient>
    <pattern id="speakerTexMute" patternUnits="userSpaceOnUse" width="2" height="2" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="2" style="stroke:#8A6D3B; stroke-width:0.6" />
    </pattern>
  </defs>

  <!-- مین باڈی -->
  <g fill="url(#goldSpeakerGradMute)">
    <path d="M 15,40 L 30,40 L 55,20 V 80 L 30,60 L 15,60 Z" />
    <!-- میوٹ کی موٹی گولڈن پٹی -->
    <rect x="10" y="46" width="75" height="9" rx="4" transform="rotate(-45 45 50)" stroke="#8A6D3B" stroke-width="1" />
  </g>

  <!-- ٹیکسچر لیئر -->
  <g fill="url(#speakerTexMute)" style="opacity: 0.5;">
    <path d="M 15,40 L 30,40 L 55,20 V 80 L 30,60 L 15,60 Z" />
    <rect x="10" y="46" width="75" height="9" rx="4" transform="rotate(-45 45 50)" />
  </g>
</svg>