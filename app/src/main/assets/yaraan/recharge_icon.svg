<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- کوئی بیک گراؤنڈ ریکٹینگولر نہیں ہے، یہ مکمل طور پر شفاف ہے -->
  <defs>
    <linearGradient id="walletBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB347" />
      <stop offset="100%" style="stop-color:#FF8C00" />
    </linearGradient>
    <linearGradient id="walletFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFE066" />
      <stop offset="100%" style="stop-color:#FFCC00" />
    </linearGradient>
    <linearGradient id="cashGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#76BA1B" />
      <stop offset="100%" style="stop-color:#4E9F3D" />
    </linearGradient>
  </defs>

  <!-- Cash -->
  <rect x="50" y="30" width="60" height="40" rx="5" fill="url(#cashGreen)" transform="rotate(-15 50 30)" />
  <rect x="80" y="25" width="60" height="40" rx="5" fill="url(#cashGreen)" transform="rotate(10 80 25)" />

  <!-- Coin -->
  <circle cx="65" cy="65" r="15" fill="#FFD700" stroke="#E6B800" stroke-width="2" />
  <text x="61" y="72" fill="#E6B800" font-family="Arial" font-weight="bold" font-size="16">$</text>

  <!-- Wallet Main -->
  <rect x="30" y="70" width="140" height="100" rx="15" fill="url(#walletBody)" />
  <path d="M30 85 C30 75, 170 75, 170 85 L170 155 C170 165, 30 165, 30 155 Z" fill="url(#walletFront)" />

  <!-- Strap & Button -->
  <rect x="110" y="105" width="65" height="35" rx="10" fill="#FF8C00" />
  <circle cx="130" cy="122.5" r="8" fill="white" />
</svg>