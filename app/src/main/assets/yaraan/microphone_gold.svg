<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- پریمیم گولڈن گریڈیئنٹ (چمک کے لیے) -->
    <linearGradient id="goldMicGradUltimate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BF953F" />
      <stop offset="25%" style="stop-color:#FCF6BA" />
      <stop offset="50%" style="stop-color:#B38728" />
      <stop offset="75%" style="stop-color:#FBF5B7" />
      <stop offset="100%" style="stop-color:#AA771C" />
    </linearGradient>

    <!-- باریک لائنوں کا ٹیکسچر (جو آپ کو پسند ہے) -->
    <pattern id="micTextureUltimate" patternUnits="userSpaceOnUse" width="2" height="2" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="2" style="stroke:#8A6D3B; stroke-width:0.6" />
    </pattern>
  </defs>

  <!-- 1. مین گولڈن باڈی لیئر (تمام حصے ٹھوس گولڈ میں) -->
  <g fill="url(#goldMicGradUltimate)">
    <!-- مائیک کا اوپر والا حصہ (Capsule) -->
    <rect x="38" y="10" width="24" height="42" rx="12" />
    
    <!-- درمیان والا حصہ (Stem) - اب یہ بالکل ٹھوس اور گولڈ ہے -->
    <rect x="43" y="66" width="14" height="16" />
    
    <!-- نیچے والا بیس (Base) -->
    <rect x="28" y="82" width="44" height="10" rx="4" />
  </g>
  
  <!-- U-شکل والا ہولڈر (یہ آؤٹ لائن میں بہتر لگتا ہے) -->
  <g fill="none" stroke="url(#goldMicGradUltimate)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 26,42 A 24,24 0 0 0 74,42" />
  </g>

  <!-- 2. ٹیکسچر لیئر (پورے ڈیزائن پر باریک لائنیں) -->
  <g fill="url(#micTextureUltimate)" style="opacity: 0.5;">
    <rect x="38" y="10" width="24" height="42" rx="12" />
    <rect x="43" y="66" width="14" height="16" />
    <rect x="28" y="82" width="44" height="10" rx="4" />
  </g>
  <g fill="none" stroke="url(#micTextureUltimate)" stroke-width="5.5" stroke-linecap="round" style="opacity: 0.5;">
    <path d="M 26,42 A 24,24 0 0 0 74,42" />
  </g>
</svg>