<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
    <defs>
        <!-- Shadows & Glows -->
        <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
        </filter>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="8" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#001824" flood-opacity="0.5"/>
        </filter>

        <!-- Gradients -->
        <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2a4d5c" />
            <stop offset="50%" stop-color="#3b6b7d" />
            <stop offset="100%" stop-color="#19333e" />
        </linearGradient>
        <linearGradient id="cyan-frame" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#88ddeb" />
            <stop offset="50%" stop-color="#4aaec2" />
            <stop offset="100%" stop-color="#76cedf" />
        </linearGradient>
        <linearGradient id="cyan-light" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e0f7fa" />
            <stop offset="100%" stop-color="#26c6da" />
        </linearGradient>
        <linearGradient id="silver-ring" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="20%" stop-color="#e0e8f0" />
            <stop offset="80%" stop-color="#a8b8c8" />
            <stop offset="100%" stop-color="#6a7d8c" />
        </linearGradient>
        <linearGradient id="wing-white" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="70%" stop-color="#e6edf2" />
            <stop offset="100%" stop-color="#b0c0cf" />
        </linearGradient>

        <!-- Stylish Corner Design -->
        <g id="stylish-corner-cyan">
            <path d="M -6 110 A 116 116 0 0 1 110 -6" fill="none" stroke="url(#cyan-frame)" stroke-width="8" stroke-linecap="round" />
            <path d="M 0 80 Q 0 0 80 0 Q 40 15 25 30 Q 10 45 0 80 Z" fill="url(#cyan-light)" />
            <circle cx="28" cy="28" r="8" fill="#ffffff" filter="url(#glow)" />
            <circle cx="55" cy="12" r="3.5" fill="#ffffff" />
            <circle cx="12" cy="55" r="3.5" fill="#ffffff" />
        </g>

        <!-- Star Sparkle -->
        <g id="sparkle">
            <path d="M 0 -20 Q 2 -5 20 0 Q 2 5 0 20 Q -2 5 -20 0 Q -2 -5 0 -20 Z" fill="#ffffff" filter="url(#glow)"/>
        </g>

        <!-- NEW HIGH WINGS (Sweeping Upwards matching your Red Lines) -->
        <g id="soft-wing">
            <!-- Highest Feather -->
            <path d="M 10 0 C 80 -40 140 -160 160 -260 C 110 -150 60 -50 10 30 Z" fill="#b0c0cf" />
            <!-- Second Feather -->
            <path d="M 5 20 C 100 -10 180 -110 220 -200 C 150 -100 80 -10 5 50 Z" fill="#cdd8e0" />
            <!-- Third Feather -->
            <path d="M 0 40 C 110 20 210 -50 260 -130 C 180 -30 100 40 0 70 Z" fill="#e6edf2" />
            <!-- Fourth Feather -->
            <path d="M -10 60 C 100 50 200 10 260 -50 C 180 20 100 70 -10 90 Z" fill="url(#wing-white)" />
            <!-- Base Fluff -->
            <path d="M -30 80 C 50 80 130 50 190 0 C 110 60 30 100 -30 110 Z" fill="url(#wing-white)" />
            <path d="M -50 90 C 20 100 90 80 140 40 C 70 90 0 110 -50 110 Z" fill="#ffffff" />
        </g>

        <!-- PERFECT TRANSPARENT DP HOLE -->
        <mask id="dp-hole">
            <rect x="0" y="0" width="800" height="800" fill="white" />
            <circle cx="400" cy="350" r="145" fill="black" />
        </mask>
    </defs>

    <g mask="url(#dp-hole)">
        <!-- Square Background -->
        <rect x="50" y="50" width="700" height="700" fill="url(#bg-grad)" rx="35" ry="35" />
        <!-- Light Rays -->
        <g opacity="0.15" stroke="#ffffff" stroke-width="2">
            <line x1="50" y1="550" x2="750" y2="300" />
            <line x1="50" y1="600" x2="750" y2="350" />
            <line x1="50" y1="650" x2="750" y2="400" />
            <line x1="50" y1="700" x2="750" y2="450" />
            <line x1="50" y1="150" x2="750" y2="350" stroke-width="4" opacity="0.5"/>
        </g>
        <!-- Placing High Wings -->
        <g transform="translate(400, 420)" filter="url(#soft-shadow)">
            <g transform="scale(-1, 1)"><use href="#soft-wing" /></g>
            <g><use href="#soft-wing" /></g>
        </g>
    </g>

    <!-- OUTER SQUARE FRAME -->
    <g filter="url(#drop-shadow)">
        <rect x="40" y="40" width="720" height="720" fill="none" stroke="url(#cyan-frame)" stroke-width="12" rx="45" ry="45" />
        <rect x="50" y="50" width="700" height="700" fill="none" stroke="#26c6da" stroke-width="3" rx="35" ry="35" />
        <rect x="34" y="34" width="732" height="732" fill="none" stroke="#e0f7fa" stroke-width="2" rx="50" ry="50" opacity="0.7"/>

        <!-- Top Center Diamond -->
        <g transform="translate(400, 40)">
            <polygon points="0,-25 35,0 0,35 -35,0" fill="url(#cyan-light)" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
            <polygon points="0,-15 20,0 0,20 -20,0" fill="#ffffff" opacity="0.8"/>
            <path d="M -150 0 C -100 0 -50 15 -35 0" fill="none" stroke="url(#cyan-light)" stroke-width="5" />
            <path d="M 150 0 C 100 0 50 15 35 0" fill="none" stroke="url(#cyan-light)" stroke-width="5" />
        </g>

        <!-- 4 Corners Placed for SQUARE box -->
        <use href="#stylish-corner-cyan" transform="translate(40, 40)" />
        <use href="#stylish-corner-cyan" transform="translate(760, 40) scale(-1, 1)" />
        <use href="#stylish-corner-cyan" transform="translate(40, 760) scale(1, -1)" />
        <use href="#stylish-corner-cyan" transform="translate(760, 760) scale(-1, -1)" />
    </g>

    <!-- Avatar Ring -->
    <g transform="translate(400, 350)" filter="url(#drop-shadow)">
        <circle cx="0" cy="0" r="160" fill="none" stroke="url(#silver-ring)" stroke-width="24" />
        <circle cx="0" cy="0" r="145" fill="none" stroke="#ffffff" stroke-width="6" />
        <circle cx="0" cy="0" r="174" fill="none" stroke="#5a6d7c" stroke-width="4" />
    </g>

    <!-- Badge Adjusted for Square Size -->
    <g transform="translate(400, 540)" filter="url(#drop-shadow)">
        <path d="M -40 -10 L -60 30 L -30 40 L 0 70 L 30 40 L 60 30 L 40 -10 Z" fill="#8ca0b3" />
        <path d="M -20 -20 L -40 20 L 0 50 L 40 20 L 20 -20 Z" fill="#e0e8f0" />
        <path d="M -30 -30 C -30 -30 0 -45 30 -30 C 45 0 30 35 0 55 C -30 35 -45 0 -30 -30 Z" fill="url(#silver-ring)" stroke="#ffffff" stroke-width="4" />
        <text x="0" y="20" font-family="'Arial', sans-serif" font-weight="bold" font-size="55" fill="#88aacc" text-anchor="middle" filter="url(#glow)">2</text>
        <text x="0" y="20" font-family="'Arial', sans-serif" font-weight="bold" font-size="55" fill="#e0f7fa" text-anchor="middle">2</text>
    </g>

    <!-- Sparkles Adjusted -->
    <g>
        <use href="#sparkle" transform="translate(200, 440) scale(0.6)" />
        <use href="#sparkle" transform="translate(620, 420) scale(0.8)" />
        <use href="#sparkle" transform="translate(280, 290) scale(0.5)" />
        <use href="#sparkle" transform="translate(550, 240) scale(0.4)" />
        <use href="#sparkle" transform="translate(500, 560) scale(0.5)" />
    </g>
</svg>