<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- سرخ کلر -->
        <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#F87171" />
            <stop offset="100%" stop-color="#991B1B" />
        </linearGradient>
        <!-- گھومنے والے دائرے کا کلر -->
        <linearGradient id="spinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#EF4444" />
            <stop offset="50%" stop-color="#FCA5A5" />
            <stop offset="100%" stop-color="#7F1D1D" />
        </linearGradient>
        <!-- چلتی ہوئی چمک -->
        <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
            <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>
        <!-- چمک کو فریم کے اندر محدود رکھنے کے لیے -->
        <clipPath id="momentClip">
            <rect x="48" y="68" width="160" height="120" rx="16" />
        </clipPath>
    </defs>
    
    <!-- گھومتا ہوا گول دائرہ -->
    <circle cx="128" cy="128" r="115" fill="none" stroke="url(#spinGrad)" stroke-width="8" stroke-dasharray="200 60 100 40" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0 128 128" to="360 128 128" dur="4s" repeatCount="indefinite" />
    </circle>

    <!-- پوسٹ/مومنٹ کا بیک گراؤنڈ (ریڈ) -->
    <rect x="48" y="68" width="160" height="120" rx="16" fill="url(#redGrad)" />
    
    <!-- اندر موجود خوبصورت سورج (White) -->
    <circle cx="96" cy="108" r="14" fill="none" stroke="#ffffff" stroke-width="10" opacity="0.9" />
    
    <!-- اندر موجود پہاڑ / مناظر (White) -->
    <path d="M 48 170 L 100 118 L 150 168 M 125 143 L 170 98 L 208 136" 
          fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

    <!-- اندر چلتی ہوئی چمک (جو ڈیزائن کے اوپر سے گزرے گی) -->
    <g clip-path="url(#momentClip)">
        <rect y="0" width="40" height="300" fill="url(#shine)" transform="skewX(-30)">
            <animate attributeName="x" values="-150; 300; 300" keyTimes="0; 0.7; 1" dur="2.5s" repeatCount="indefinite" />
        </rect>
    </g>
</svg>