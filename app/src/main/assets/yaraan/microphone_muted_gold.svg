<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldMuteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BF953F" />
      <stop offset="25%" style="stop-color:#FCF6BA" />
      <stop offset="50%" style="stop-color:#B38728" />
      <stop offset="75%" style="stop-color:#FBF5B7" />
      <stop offset="100%" style="stop-color:#AA771C" />
    </linearGradient>
    <pattern id="muteTex" patternUnits="userSpaceOnUse" width="2" height="2" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="2" style="stroke:#8A6D3B; stroke-width:0.6" />
    </pattern>
  </defs>

  <!-- مین مائیکروفون باڈی (ٹھوس گولڈ) -->
  <g fill="url(#goldMuteGrad)">
    <rect x="38" y="10" width="24" height="42" rx="12" />
    <rect x="43" y="66" width="14" height="16" />
    <rect x="28" y="82" width="44" height="10" rx="4" />
  </g>
  <path d="M 26,42 A 24,24 0 0 0 74,42" fill="none" stroke="url(#goldMuteGrad)" stroke-width="7" stroke-linecap="round" />

  <!-- میوٹ لائن (گولڈن کٹ) -->
  <rect x="15" y="47" width="70" height="8" rx="4" fill="url(#goldMuteGrad)" transform="rotate(-45 50 50)" stroke="#8A6D3B" stroke-width="1" />

  <!-- ٹیکسچر لیئر -->
  <g fill="url(#muteTex)" style="opacity: 0.5;">
    <rect x="38" y="10" width="24" height="42" rx="12" />
    <rect x="43" y="66" width="14" height="16" />
    <rect x="28" y="82" width="44" height="10" rx="4" />
    <rect x="15" y="47" width="70" height="8" rx="4" transform="rotate(-45 50 50)" />
  </g>
  <path d="M 26,42 A 24,24 0 0 0 74,42" fill="none" stroke="url(#muteTex)" stroke-width="5.5" stroke-linecap="round" style="opacity: 0.5;" />
</svg>