<svg width="150" height="100" viewBox="0 0 150 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- گولڈن کارڈ گریڈیئنٹ -->
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB800" />
      <stop offset="100%" style="stop-color:#FFD600" />
    </linearGradient>
    <!-- بلر فلٹر -->
    <filter id="b1"><feGaussianBlur stdDeviation="2" /></filter>
  </defs>

  <!-- مین کارڈ بیک گراؤنڈ -->
  <rect width="150" height="100" rx="15" fill="url(#g1)" />

  <!-- کوائن 1 (ٹاپ رائٹ) -->
  <g opacity="0.25" filter="url(#b1)">
    <circle cx="125" cy="25" r="12" fill="#FFD700" stroke="#B8860B" stroke-width="1.2" />
    <circle cx="125" cy="25" r="9" fill="none" stroke="#B8860B" stroke-width="0.5" stroke-dasharray="1,1" />
    <text x="125" y="29" fill="#B8860B" font-size="10" font-family="Arial" font-weight="bold" text-anchor="middle">$</text>
  </g>

  <!-- کوائن 2 (باٹم لیفٹ) -->
  <g opacity="0.2" filter="url(#b1)">
    <circle cx="25" cy="65" r="10" fill="#FFD700" stroke="#B8860B" stroke-width="1" />
    <text x="25" y="69" fill="#B8860B" font-size="8" font-family="Arial" font-weight="bold" text-anchor="middle">$</text>
  </g>

  <!-- کوائن 3 (درمیان میں چھوٹا) -->
  <g opacity="0.15" filter="url(#b1)">
    <circle cx="45" cy="15" r="7" fill="#FFD700" stroke="#B8860B" stroke-width="0.8" />
    <text x="45" y="18" fill="#B8860B" font-size="6" font-family="Arial" font-weight="bold" text-anchor="middle">$</text>
  </g>

  <!-- کارڈ کا ٹیکسٹ -->
  <text x="50%" y="92" fill="white" font-family="Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle" opacity="0.95">Contribution Ranking</text>
</svg>