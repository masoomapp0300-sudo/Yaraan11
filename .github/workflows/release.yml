##Github build work flow cod###

name: Build Signed Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Check Android project
        run: |
          if [ ! -f "gradlew" ]; then
            echo "The Gradle wrapper was not found in the repository root."
            exit 1
          fi

          chmod +x gradlew

      - name: Remove stale Gradle project cache
        run: |
          rm -rf .gradle
          find . -type d -name build -prune -exec rm -rf {} +

      - name: Check required secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Missing secret: KEYSTORE_PASSWORD"
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "Missing secret: KEY_ALIAS"
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "Missing secret: KEY_PASSWORD"
            exit 1
          fi

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing secret: KEYSTORE_FILE_BASE64"
            exit 1
          fi

      - name: Decode Existing Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Find and verify APK
        id: find_apk
        shell: bash
        run: |
          APK_PATH=$(find . -type f -path "*/build/outputs/apk/release/*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "No release APK was found."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK_PATH"

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK package
        uses: actions/upload-artifact@v4
        with:
          name: Yaraan-Signed-Release-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
