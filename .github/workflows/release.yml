Name: Build Signed Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Check Android project
        run: |
          if [ ! -f "gradlew" ]; then
            echo "The Gradle wrapper was not found in the repository root."
            exit 1
          fi
          chmod +x gradlew

      - name: Handle Dummy google-services.json (If Missing)
        run: |
          if [ ! -f "app/google-services.json" ]; then
            echo '{"project_info":{"project_number":"123456789","project_id":"dummy-app","storage_bucket":"dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789:android:123456789","android_client_info":{"package_name":"com.example.yaraan"}},"oauth_client":[],"api_key":[{"current_key":"dummy"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}]}' > app/google-services.json
          fi

      - name: Decode Keystore from Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: "-Djava.awt.headless=true"
        run: ./gradlew assembleRelease --stacktrace --no-daemon -Djava.awt.headless=true

      - name: Find and verify APK
        id: find_apk
        shell: bash
        run: |
          APK_PATH=$(find . -type f -path "*/build/outputs/apk/release/*.apk" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "No release APK was found."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK package
        uses: actions/upload-artifact@v4
        with:
          name: Yaraan-Signed-Release-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
